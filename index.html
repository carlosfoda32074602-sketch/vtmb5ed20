function rollCheck(){let c=char(),a=$('#roll-attr').value,s=$('#roll-skill').value,prof=$('#roll-prof').checked?+c.prof:0,mod=getMod(),adv=$('#roll-adv').value,target=$('#roll-target').value===''?null:+$('#roll-target').value;let r1=rollDie(20),r2=(adv==='adv'||adv==='dis')?rollDie(20):null,nat=adv==='adv'?Math.max(r1,r2):adv==='dis'?Math.min(r1,r2):r1;let total=nat+attrVal(c,a)+(s==='—'?0:(+c.skills[s]||0))+prof+mod;let hungry=($('#roll-hunger')?.checked||state.globalHungerDice)&&+c.hunger>0?rollDie(20):null;let comp=hungry!==null&&hungry<=+c.hunger;let parts=`d20 ${r1}${r2!==null?` / ${r2} (${adv==='adv'?'Vantagem':'Desvantagem'} → ${nat})`:''} + ${a} ${attrVal(c,a)}${s!=='—'?` + ${s} ${+c.skills[s]||0}`:''}${prof?` + Prof. ${prof}`:''}${mod?` ${mod>0?'+':''}${mod}`:''}`;let result=`<div class="roll-result"><div class="chat-meta"><strong>${esc(c.name)}</strong><span>Teste</span></div><div class="total">${total}</div><div class="detail">${esc(parts)}</div>${target!==null?`<div class="detail">CD ${target}: <b style="color:${total>=target?'#69d59a':'#f18b92'}">${total>=target?'SUCESSO':'FALHA'}</b></div>`:''}${hungry!==null?`<div class="detail">Dado da Fome: ${hungry} contra Fome ${c.hunger} — <b style="color:${comp?'#ff8b9b':'#69d59a'}">${comp?'COMPLICAÇÃO':'sem complicação'}</b></div>`:''}</div>`;addChat(c.name,`rolou um teste: ${total}${target!==null?` vs CD ${target} (${total>=target?'sucesso':'falha'})`:''}${comp?' • Complicação de Fome':''}`,'roll',result);if(comp)toast('Complicação de Fome! Registre a consequência narrativa.');}
function quickDice(sides){let n=+($('#dice-count')?.value||1),mod=+($('#dice-mod')?.value||0);let r=Array.from({length:Math.max(1,Math.min(50,n))},()=>rollDie(sides));let total=r.reduce((a,b)=>a+b,0)+mod;let detail=`${r.join(' + ')}${mod?` ${mod>0?'+':''} ${mod}`:''} = ${total}`;addChat(char().name,`rolou ${r.length}d${sides}${mod?` ${mod>0?'+':''}${mod}`:''}: ${total}`,'roll',`<div class="roll-result"><div class="chat-meta"><strong>${esc(char().name)}</strong><span>${r.length}d${sides}</span></div><div class="total">${total}</div><div class="detail">${detail}</div></div>`)}
function rollDamage(expr){try{let d=parseDice(expr||($('#damage-formula')?.value||$('#damage-formula2')?.value||'1d6')); addChat(char().name,`rolou dano ${d.expr}: ${d.total}`,'roll',`<div class="roll-result"><div class="chat-meta"><strong>${esc(char().name)}</strong><span>Dano</span></div><div class="total">${d.total}</div><div class="detail">${d.rolls.join(' + ')}${d.mod?` ${d.mod>0?'+':''} ${d.mod}`:''}</div></div>`)}catch(e){toast(e.message)}}
function rollAttack(){let c=char(),a=$('#atk-attr')?.value||'Força',s=$('#atk-skill')?.value||'Briga',target=+($('#atk-defense')?.value||10),mod=+($('#atk-mod')?.value||0);let r=rollDie(20),total=r+attrVal(c,a)+(+c.skills[s]||0)+(+c.prof||0)+mod;let hit=total>=target;let damage='';if(hit){try{let d=parseDice($('#atk-damage')?.value||'1d6');let attrDamage=$('#atk-add-attr')?.checked===false?0:attrVal(c,a);let finalDamage=d.total+attrDamage;damage=`; dano ${finalDamage} (${d.rolls.join('+')}${d.mod?`${d.mod>0?'+':''}${d.mod}`:''}${attrDamage?` + ${a} ${attrDamage}`:''})`}catch(e){damage=''}}let hunger=($('#atk-hunger')?.checked||state.globalHungerDice)&&+c.hunger>0?rollDie(20):null,comp=hunger!==null&&hunger<=+c.hunger;let html=`<div class="roll-result"><div class="chat-meta"><strong>${esc(c.name)}</strong><span>Ataque</span></div><div class="total">${total}</div><div class="detail">d20 ${r} + ${a} ${attrVal(c,a)} + ${s} ${+c.skills[s]||0} + Prof. ${c.prof} ${mod?`${mod>0?'+':''}${mod}`:''}</div><div class="detail">Defesa ${target}: <b style="color:${hit?'#69d59a':'#f18b92'}">${hit?'ACERTO':'ERROU'}</b>${esc(damage)}</div>${hunger!==null?`<div class="detail">Dado da Fome ${hunger} — ${comp?'COMPLICAÇÃO':'sem complicação'}</div>`:''}</div>`;addChat(c.name,`ataque ${hit?'acertou':'errou'} (${total} vs Defesa ${target})${hit?damage:''}${comp?' • Complicação de Fome':''}`,'roll',html);if(comp)toast('Complicação de Fome!')}
function rollInitiative(){let c=char(),r=rollDie(20),total=r+(+c.attributes.destreza||0)+(+c.prof||0);let existing=state.initiative.find(x=>x.charId===c.id);if(existing)existing.score=total;else state.initiative.push({id:id(),charId:c.id,name:c.name,clan:c.clan,score:total});state.initiative.sort((a,b)=>b.score-a.score);state.activeInit=0;save();renderInitiative();addChat(c.name,`rolou iniciativa: ${r} + Destreza ${c.attributes.destreza} + Prof. ${c.prof} = ${total}`,'roll',`<div class="roll-result"><div class="total">${total}</div><div class="detail">Iniciativa: d20 ${r} + Destreza + Proficiência</div></div>`)}
function canControlToken(token){if(!sessionStorage.getItem('vtm_room_id'))return true;if(sessionStorage.getItem('vtm_role')==='narrator')return true;const uid=currentAuthUserId;if(!uid||!token)return false;const character=(state.characters||[]).find(c=>String(c.id)===String(token.characterId));return !!character&&character.ownerId===uid&&token.ownerId===uid}
function addSelectedToken(){let clan=state.selectedClan,role=sessionStorage.getItem('vtm_role'),room=!!sessionStorage.getItem('vtm_room_id'),character=state.characters.find(c=>String(c.id)===String(state.activeCharacterId));if(room&&role!=='narrator'&&(!character||character.ownerId!==currentAuthUserId)){toast('Selecione primeiro uma ficha sua para vincular o token.');return}let token={id:id(),clan,label:room&&role!=='narrator'?(character.name||clan):clan,x:50,y:50,characterId:room&&role!=='narrator'?String(character.id):null,ownerId:room&&role!=='narrator'?character.ownerId:currentAuthUserId};state.tokens.push(token);state.selectedToken=token.id;save();renderMap();toast(`Token ${token.label} adicionado. Arraste-o para posicionar.`)}
function updateTokenPos(tokenId,x,y){let t=state.tokens.find(t=>String(t.id)===String(tokenId));if(!t)return;if(!canControlToken(t)){toast('Você só pode mover tokens vinculados às suas próprias fichas.');return}t.x=Math.max(4,Math.min(96,x));t.y=Math.max(5,Math.min(94,y));save()}

wire();renderConnection();}

function renderCharacters(c,d){return `<div class="toolbar"><span class="scene-name">♙ Personagens</span><button class="primary" id="new-char">＋ Nova ficha</button><button id="duplicate-char">Duplicar ficha</button><button id="export-char">Exportar ficha JSON</button><button id="import-char">Importar ficha</button><input type="file" id="import-file" accept="application/json" class="hidden"></div><div class="clan-cards">${state.characters.map(ch=>{let dd=derived(ch);return `<article class="clan-card"><div class="clan-card-head">${tokenHTML(ch.clan)}<div><h3>${esc(ch.name)}</h3><div class="tagline">${esc(ch.clan)} · ${ch.generation}ª Geração</div></div></div><p>${esc(ch.concept||'Sem conceito definido')}</p><div class="derived-list"><div class="derived"><span>Vitalidade</span><b>${dd.health}</b></div><div class="derived"><span>Defesa</span><b>${dd.defense}</b></div><div class="derived"><span>PB</span><b>${ch.pb}</b></div><div class="derived"><span>Fome</span><b>${ch.hunger}</b></div></div><div class="mini-actions" style="margin-top:10px"><button data-activate-char="${ch.id}" class="${ch.id===state.activeCharacterId?'primary':''}">${ch.id===state.activeCharacterId?'Ficha ativa':'Abrir ficha'}</button><button data-delete-char="${ch.id}">Excluir</button></div></article>`}).join('')}</div><section class="panel"><div class="panel-head"><strong>Ficha ativa: ${esc(c.name)}</strong><span class="pill">Salvamento automático</span></div><div class="panel-body"><p style="color:var(--muted);font-size:12px">Edite os campos na ficha à direita. A ficha guarda Atributos, 28 Habilidades, Disciplinas, Recursos, Convicções, Tocantes, Vantagens, Defeitos, equipamento e notas. Use Exportar para criar uma cópia portátil.</p><div class="mini-actions"><button id="save-char" class="primary">Salvar agora</button><button id="export-char2">Exportar JSON</button><button id="new-char2">Criar outra ficha</button></div></div></section>`}
function renderClans(){return `<div class="toolbar"><span class="scene-name">✥ Os sete Clãs</span><span class="pill">Escolha um Clã para criar token ou ficha</span></div><div class="clan-cards">${Object.keys(CLANS).map(n=>{let c=CLANS[n];return `<article class="clan-card"><div class="clan-card-head">${tokenHTML(n)}<div><h3>${n}</h3><div class="tagline">${c.tag}</div></div></div><p><b>Atributos favorecidos:</b> ${c.fav}<br><b>Disciplinas:</b> ${c.disc}</p><div class="subhead">Vantagens de Clã</div><ul>${c.advantages.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><div class="subhead">Maldição</div><p>${esc(c.curse)}</p><div class="mini-actions"><button data-clan="${n}" class="primary">Selecionar token</button><button data-new-clan="${n}">Criar ficha</button><button data-add-clan-token="${n}">Adicionar ao mapa</button></div></article>`}).join('')}</div>`}
function renderDicePage(){return `<div class="toolbar"><span class="scene-name">⚄ Dados & Testes</span><span class="pill">Rolagens instantâneas</span></div><section class="panel"><div class="panel-head"><strong>Dados poliédricos</strong></div><div class="panel-body"><div class="form-grid three"><div class="field"><label>Quantidade</label><input id="dice-count" type="number" min="1" max="50" value="1"></div><div class="field"><label>Modificador</label><input id="dice-mod" type="number" value="0"></div><div class="field"><label>Fórmula de dano</label><input id="damage-formula2" value="1d6+3"></div></div><div class="quick-dice" style="margin-top:12px">${[4,6,8,10,12,20,100].map(n=>`<button class="die-btn" data-die="${n}">d${n}<span>rolar</span></button>`).join('')}<button class="primary" id="damage2">Rolar fórmula</button></div></div></section><section class="panel"><div class="panel-head"><strong>Teste de personagem</strong></div><div class="panel-body"><p style="font-size:12px;color:var(--muted)">Use o teste padrão do livro: 1d20 + Atributo + Habilidade + Proficiência + modificadores. Vantagem rola dois d20 e mantém o maior; Desvantagem mantém o menor.</p><div class="form-grid three"><div class="field"><label>Atributo</label><select id="roll-attr">${ATTRS.map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label>Habilidade</label><select id="roll-skill"><option>—</option>${SKILLS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>CD</label><input type="number" id="roll-target" placeholder="15"></div><div class="field"><label>Modificador</label><input type="number" id="roll-mod" value="0"></div><div class="field"><label>Vantagem / Desvantagem</label><select id="roll-adv"><option value="normal">Normal</option><option value="adv">Vantagem</option><option value="dis">Desvantagem</option></select></div><div class="field"><label>Dado da Fome</label><label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" id="roll-hunger" style="width:auto"> Se Fome &gt; 0</label></div></div><div class="mini-actions" style="margin-top:10px"><label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" id="roll-prof" checked style="width:auto"> Proficiência</label><button class="primary" id="roll-check">Rolar teste</button><button id="initiative-btn">Rolar iniciativa</button></div></div></section>`}
function renderCompendium(){let c=char(),d=derived(c);return `<div class="toolbar"><span class="scene-name">▤ Compêndio rápido</span><span class="pill">Referência do livro de regras</span></div><div class="compendium-grid"><article class="rule-card"><h3>Teste padrão</h3><p><code>1d20 + Atributo + Habilidade + Proficiência + modificadores</code></p><p>Faça um teste quando houver risco, oposição, pressão ou consequência relevante. Se não existe risco significativo, não há teste. O jogador descreve a intenção e a abordagem; o Narrador escolhe a combinação adequada.</p><ul><li>CD 10 — Fácil</li><li>CD 15 — Desafiadora</li><li>CD 20 — Difícil</li><li>CD 25 — Extrema</li><li>CD 30 — Sobrenatural</li><li>CD 35+ — Lendária</li></ul></article><article class="rule-card"><h3>Estatísticas derivadas</h3><p>Vitalidade: <code>10 + Constituição + (PB × 2)</code></p><p>Defesa: <code>10 + Destreza + Proficiência + bônus</code></p><p>Iniciativa: <code>1d20 + Destreza + Proficiência</code></p><p>Movimento: <code>9 + Destreza metros</code></p><p>Resistência Física/Mental/Social: Constituição/Sabedoria/Carisma + Proficiência.</p><p>Força de Vontade máxima e base para testes: <code>5 + Carisma</code>.</p><p>Resistência da Besta: <code>5 + Sabedoria + Carisma + Humanidade atual</code>, salvo regra específica.</p><p>Seus valores atuais calculados: Vitalidade ${d.health}, Defesa ${d.defense}, Movimento ${d.move} m, RF ${d.physical}, RM ${d.mental}, RS ${d.social}.</p></article><article class="rule-card"><h3>Fome e Dado da Fome</h3><p>Fome varia de 0 a 5. Ao acordar de um descanso, aumenta em 1, até o máximo 5. Gastar Vitae não aumenta Fome por si só; um poder só aumenta Fome quando declara o valor e o momento.</p><p>Como padrão, uma ativação que gasta Vitae para produzir efeito sobrenatural exige um Dado da Fome; poderes passivos sem ativação, efeitos gratuitos e gastos puramente mundanos não o exigem, salvo texto específico.</p><p>Se o Dado da Fome for menor ou igual à Fome atual, ocorre Complicação. O dado é separado do d20 principal.</p></article><article class="rule-card"><h3>Disciplina e CD</h3><p>CD de Disciplina: <code>10 + Atributo-chave + Proficiência + PB</code>, apenas quando o poder indicar “contra CD”.</p><p>Teste de Disciplina: <code>1d20 + Atributo-chave + Proficiência + PB</code>. O nível da Disciplina não é somado ao teste.</p><p>Quando um poder disser “vs. Física/Mental/Social”, compare o total do teste do usuário com a resistência fixa do alvo; não faça uma segunda rolagem.</p></article><article class="rule-card"><h3>Dano e Torpor</h3><p>Dano físico: dado da arma + Atributo apropriado + modificadores. A Resistência Física reduz dano em até 5 pontos por ataque; esse limite vale para dano, não para testes de resistência nem outros efeitos.</p><p>Quando a Vitalidade chega a 0, o vampiro entra em Torpor. Torpor não é Morte Final. Reduções, armaduras e efeitos especiais devem ser aplicados conforme a ordem indicada no poder ou regra específica.</p></article><article class="rule-card"><h3>Vitae máxima por PB</h3><p>PB 1–10: <code>10 + (PB × 5)</code>. PB 11: 80 Vitae. PB 12: 100 Vitae.</p><p>Potência de Sangue e Proficiência são valores independentes. A Geração determina o teto natural de PB: 13ª → 1; 12ª → 2; 11ª → 3; 10ª → 4; 9ª → 5; 8ª → 6; 7ª → 7; 6ª → 8; 5ª → 9; 4ª → 10; 3ª → 11; 2ª → 12.</p></article><article class="rule-card"><h3>Ordem de resolução</h3><p>1. Leia o efeito específico e seus gatilhos. 2. Pague custos e declare o alvo. 3. Faça o teste indicado. 4. Compare com CD, Defesa ou Resistência. 5. Aplique dano, condições e reduções. 6. Atualize Vitae, Fome, Força de Vontade e demais recursos.</p><p>Se uma regra específica modificar uma regra geral, use a exceção específica apenas no escopo declarado. Se houver dúvida, o Narrador define uma decisão consistente e a aplica igualmente em situações semelhantes.</p></article><article class="rule-card"><h3>Uso da mesa virtual</h3><p>Arraste os tokens para movê-los. Clique em um Clã para escolher o token que será adicionado. Edite a ficha pelos separadores; as estatísticas derivadas são recalculadas. Use chat para registrar declarações e resultados, e a iniciativa para ordenar os turnos.</p><p>Os dados são rolados no navegador. Em uma sala hospedada com o servidor incluído, mensagens, fichas, tokens e resultados são compartilhados em tempo real.</p></article><article class="rule-card"><h3>Humanidade</h3><p>Humanidade inicial: <b>5</b>. Quando a regra pedir um Teste de Humanidade, role <code>d20 + Humanidade atual + Sabedoria</code>. Aplique a CD e as consequências da situação; não substitua esse teste por um teste genérico de Força de Vontade.</p></article>
<article class="rule-card"><h3>Força de Vontade</h3><p>Força de Vontade máxima e valor-base para testes: <code>5 + Carisma</code>. O valor atual registra quanto ainda pode ser gasto. Ao gastar ou recuperar Força de Vontade, altere o valor atual sem mudar o máximo calculado.</p></article>
<article class="rule-card"><h3>Diablerie</h3><p>Diablerie é a destruição e absorção da essência de outro vampiro. Trate-a como ação narrativa excepcional, com risco, testemunhas, consequências políticas e julgamento do Narrador. O alvo precisa estar vulnerável conforme as regras da crônica; resolva resistência da vítima, absorção e efeitos sobre Potência de Sangue ou Geração sem conceder aumentos automáticos fora do procedimento estabelecido. A diablerie deixa marcas espirituais e pode gerar consequências duradouras.</p></article>
<article class="rule-card"><h3>Fome e alimentação</h3><p>Fome varia de 0 a 5. Quando uma regra exigir Dado da Fome, role-o separadamente e compare o resultado com a Fome atual conforme a regra de Complicação de Fome usada pela mesa. Alimentação, gasto de Vitae e recuperação atualizam os recursos sem ultrapassar seus limites.</p></article>
<article class="rule-card"><h3>Combate e dano</h3><p>A rolagem de ataque determina o resultado do teste; o dano é resolvido separadamente pela fórmula do ataque. Aplique tipo de dano, Resistência Física, reduções, vulnerabilidades e condições na ordem indicada pela regra específica. Não use Defesa-alvo como substituto de resistência ou redução de dano.</p></article>
<article class="rule-card"><h3>Iniciativa e turnos</h3><p>Role iniciativa para cada participante e registre o total na lista da mesa. A ordem fica em ordem decrescente; avance o turno após a ação dos participantes. Remova resultados antigos quando um combate terminar ou role novamente quando a cena exigir.</p></article>
</div>`}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()});document.querySelectorAll('[data-clan]').forEach(b=>b.onclick=()=>{state.selectedClan=b.dataset.clan;save();if(state.page==='Clãs')render();else{document.querySelectorAll('[data-clan]').forEach(x=>x.classList.toggle('selected',x.dataset.clan===state.selectedClan));toast(`${state.selectedClan} selecionado para tokens.`)}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.sheetTab=b.dataset.tab;render()});document.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('change',()=>{updateField(el);if(sessionStorage.getItem('vtm_room_id'))syncRoomCharacters()});el.addEventListener('input',()=>{updateField(el,false);refreshDerived()})});document.querySelectorAll('[data-condition]').forEach(b=>b.onclick=()=>{let c=char();c.conditions=c.conditions||[];if(c.conditions.includes(b.dataset.condition))c.conditions=c.conditions.filter(x=>x!==b.dataset.condition);else c.conditions.push(b.dataset.condition);save();render()});document.querySelectorAll('[data-activate-char]').forEach(b=>b.onclick=()=>{state.activeCharacterId=b.dataset.activateChar;state.page='Personagens';save();render()});document.querySelectorAll('[data-delete-char]').forEach(b=>b.onclick=()=>{});document.querySelectorAll('[data-new-clan]').forEach(b=>b.onclick=()=>{let c=blankChar(b.dataset.newClan);state.characters.push(c);state.activeCharacterId=c.id;state.page='Personagens';save();render()});document.querySelectorAll('[data-add-clan-token]').forEach(b=>b.onclick=()=>{state.selectedClan=b.dataset.addClanToken;state.page='Mesa';save();render();addSelectedToken()});document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>quickDice(+b.dataset.die));$('#roll-check')?.addEventListener('click',rollCheck);$('#roll-damage-btn')?.addEventListener('click',rollDamage);$('#damage2')?.addEventListener('click',()=>rollDamage($('#damage-formula2')?.value));$('#initiative-btn')?.addEventListener('click',rollInitiative);$('#initiative-btn2')?.addEventListener('click',rollInitiative);$('#chat-form')?.addEventListener('submit',e=>{e.preventDefault();let i=$('#chat-input'),v=i.value.trim();if(v){addChat(char().name,v);i.value=''}});$('#next-turn')?.addEventListener('click',()=>{if(state.initiative.length){state.activeInit=(state.activeInit+1)%state.initiative.length;save();renderInitiative()}});$('#clear-init')?.addEventListener('click',()=>{state.initiative=[];state.activeInit=0;save();render()});document.querySelectorAll('[data-init-del]').forEach(b=>b.onclick=()=>{state.initiative=state.initiative.filter(x=>x.id!==b.dataset.initDel);save();renderInitiative()});document.querySelectorAll('[data-init-up]').forEach(b=>b.onclick=()=>{let i=state.initiative.findIndex(x=>x.id===b.dataset.initUp);if(i>0){[state.initiative[i-1],state.initiative[i]]=[state.initiative[i],state.initiative[i-1]];save();renderInitiative()}});$('#add-token')?.addEventListener('click',addSelectedToken);$('#add-token-map')?.addEventListener('click',addSelectedToken);$('#grid-btn')?.addEventListener('click',()=>{state.mapGrid=!state.mapGrid;save();renderMap()});$('#grid-btn2')?.addEventListener('click',()=>{state.mapGrid=!state.mapGrid;save();renderMap()});$('#center-map')?.addEventListener('click',()=>{state.tokens.forEach((t,i)=>{t.x=20+(i%4)*20;t.y=28+Math.floor(i/4)*30});save();renderMap()});$('#clear-tokens')?.addEventListener('click',()=>{if(confirm('Remover todos os tokens do mapa?')){state.tokens=[];save();renderMap()}});$('#scene-btn')?.addEventListener('click',()=>showModal('Editar cena',`<div class="field"><label>Nome da cena</label><input id="scene-name-input" value="${esc(state.scene)}"></div><p style="font-size:12px;color:var(--muted)">O nome aparece na barra da mesa compartilhada.</p>`,`<button id="scene-save" class="primary">Salvar</button>`));$('#room-btn')?.addEventListener('click',()=>showMultiplayerGate());$('#duplicate-char')?.addEventListener('click',()=>{let c=clone(char());c.id=id();c.name+=' (cópia)';state.characters.push(c);state.activeCharacterId=c.id;save();render()});$('#save-char')?.addEventListener('click',()=>{save();toast('Ficha salva neste navegador.')});$('#export-char')?.addEventListener('click',exportChar);$('#export-char2')?.addEventListener('click',exportChar);$('#export-btn')?.addEventListener('click',exportTable);$('#import-char')?.addEventListener('click',()=>$('#import-file').click());$('#import-file')?.addEventListener('change',importChar);$('#rest-btn')?.addEventListener('click',()=>{let c=char();c.hunger=Math.min(5,(+c.hunger||0)+1);save();render()});$('#spend-vitae')?.addEventListener('click',()=>{let c=char();if(c.vitae>0)c.vitae--;else toast('Vitae insuficiente.');save();render()});$('#spend-will')?.addEventListener('click',()=>{let c=char();if(c.willpower>0)c.willpower--;else toast('Força de Vontade insuficiente.');save();render()});$('#atk-roll')?.addEventListener('click',rollAttack);$('#room-save')?.addEventListener('click',()=>showMultiplayerGate());$('#scene-save')?.addEventListener('click',()=>{state.scene=$('#scene-name-input').value.trim()||'Cena sem nome';save();$('#modal-root').innerHTML='';render()});$('#atk-attr')?.addEventListener('change',()=>{});wireMap();}
function updateField(el,rerender=true){let path=el.dataset.field.split('.'),c=char(),obj=c;for(let i=0;i<path.length-1;i++)obj=obj[path[i]];let key=path[path.length-1],v=el.value;if(el.type==='number')v=+v;if(el.tagName==='SELECT'&&key==='clan'){v=el.value;c.clan=v;let t=state.tokens.find(t=>t.charId===c.id);if(t)t.clan=v;}obj[key]=v;if(key==='clan'){state.selectedClan=v;state.tokens.filter(t=>t.charId===c.id).forEach(t=>t.clan=v)}if(key==='pb'||key==='generation'||key==='prof'||path[0]==='attributes'||key==='humanity'||key==='healthBonus'||key==='defenseBonus'){refreshDerived()}save();if(rerender&&(key==='clan'||key==='name'||key==='concept'))render();}
function refreshDerived(){
 let c=char(),d=derived(c);
 if(state.sheetTab==='Atributos'){
   const stats=document.querySelectorAll('.sheet-content .stats-grid .stat');
   const vals=[[d.health,`atual ${c.health}/${d.health}`],[d.defense,'inclui Proficiência'],[d.move+' m','por turno'],[c.hunger,'0–5'],[c.vitae,'máx. '+d.vitaeMax],[c.humanity,'atual']];
   stats.forEach((el,i)=>{if(vals[i]){const strong=el.querySelector('strong'),small=el.querySelector('small');if(strong)strong.textContent=vals[i][0];if(small)small.textContent=vals[i][1]}});
   const derivedVals=[d.physical,d.mental,d.social,d.willMax,d.beast,d.vitaeMax];
   document.querySelectorAll('.sheet-content .derived b').forEach((b,i)=>{if(derivedVals[i]!==undefined)b.textContent=derivedVals[i]});
   const willInput=document.querySelector('[data-field="willpower"]');if(willInput){willInput.max=d.willMax;if(+willInput.value>d.willMax)willInput.value=d.willMax}
   const vitaeInput=document.querySelector('[data-field="vitae"]');if(vitaeInput)vitaeInput.max=d.vitaeMax;
   const healthInput=document.querySelector('[data-field="health"]');if(healthInput)healthInput.max=d.health;
 }
}
function wireMap(){let map=$('#map');if(!map)return;map.querySelectorAll('.map-token').forEach(el=>{el.onpointerdown=e=>{let tokenId=el.dataset.token;state.selectedToken=tokenId;drag={id:tokenId,pointer:e.pointerId};el.setPointerCapture?.(e.pointerId);map.querySelectorAll('.map-token').forEach(n=>n.classList.toggle('selected',n.dataset.token===tokenId))};el.onpointermove=e=>{if(!drag||drag.id!==el.dataset.token)return;let r=map.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;updateTokenPos(drag.id,x,y);el.style.left=state.tokens.find(t=>t.id===drag.id).x+'%';el.style.top=state.tokens.find(t=>t.id===drag.id).y+'%'};el.onpointerup=e=>{if(drag&&drag.id===el.dataset.token){drag=null;save();el.classList.toggle('selected',state.selectedToken===el.dataset.token)}};el.onclick=()=>{state.selectedToken=el.dataset.token;save();renderMap()};el.ondblclick=()=>{let t=state.tokens.find(t=>t.id===el.dataset.token);let v=prompt('Nome do token:',t.label||t.clan);if(v!==null){t.label=v;save();renderMap()}}});}
async function roomRequest(route,payload){const client=initSupabase();if(!client)throw new Error('Configure primeiro o URL e a chave pública do Supabase.');const {data:authData}=await client.auth.getSession();if(!authData.session)throw new Error('Entre com sua conta de e-mail antes de criar ou entrar em uma sala.');let rpc,args;if(route==='/api/rooms/create'){rpc='vtm_create_room';args={p_name:payload.name,p_host_password:payload.hostPassword,p_invite_password:payload.joinPassword,p_display_name:payload.playerName}}else if(route==='/api/rooms/join'){rpc='vtm_join_room';args={p_code:payload.room,p_invite_password:payload.password,p_display_name:payload.playerName}}else{rpc='vtm_resume_as_narrator';args={p_code:payload.room,p_host_password:payload.password,p_display_name:payload.playerName}}const {data,error}=await client.rpc(rpc,args);if(error)throw new Error(error.message);return {room:data.code,roomId:data.id,role:data.role,name:data.display_name,state:null}}
function acceptRoom(data){sessionStorage.setItem('vtm_session','1');sessionStorage.setItem('vtm_role',data.role);sessionStorage.setItem('vtm_room',data.room);sessionStorage.setItem('vtm_room_id',data.roomId);sessionStorage.setItem('vtm_name',data.name||'');state.room=data.room;history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(data.room));$('#modal-root').innerHTML='';save(false);render();connect();toast(`Conectando à sala ${data.room} como ${data.role==='narrator'?'Narrador':'Jogador'}.`)}
function showMultiplayerGate(){showModal('Multiplayer · Supabase',`<p style="color:var(--muted);font-size:12px;margin-top:0">A conexão usa Supabase para autenticação, persistência e sincronização em tempo real. O URL e a chave pública ficam salvos somente neste navegador.</p><div class="subhead">1 · Configuração do Supabase</div><div class="field"><label>Project URL</label><input id="mp-sb-url" placeholder="https://seu-projeto.supabase.co"></div><div class="field" style="margin-top:8px"><label>Publishable key / anon key</label><input id="mp-sb-key" autocomplete="off" placeholder="sb_publishable_… ou chave anon legada"></div><button id="mp-sb-save" class="primary" style="width:100%;margin-top:8px">Salvar configuração</button><div class="subhead">2 · Conta da mesa</div><div class="field"><label>E-mail</label><input id="mp-email" type="email" autocomplete="email" placeholder="voce@exemplo.com"></div><div class="field" style="margin-top:8px"><label>Senha da conta</label><input id="mp-auth-pass" type="password" autocomplete="current-password" placeholder="Senha da conta Supabase"></div><div class="form-grid" style="margin-top:8px"><button id="mp-signup">Criar conta</button><button id="mp-login" class="primary">Entrar</button></div><p id="mp-auth-status" style="font-size:11px;color:var(--muted)"></p><div class="subhead">3 · Criar sala · Narrador</div><div class="field"><label>Seu nome na mesa</label><input id="mp-name" maxlength="40" placeholder="Narrador"></div><div class="field" style="margin-top:8px"><label>Nome da crônica</label><input id="mp-title" maxlength="70" value="As Sombras da Cidade"></div><div class="form-grid" style="margin-top:8px"><div class="field"><label>Senha do Narrador (8+)</label><input id="mp-host-pass" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Senha de convite (6+)</label><input id="mp-join-pass" type="password" minlength="6" autocomplete="new-password"></div></div><button id="mp-create" class="primary" style="width:100%;margin-top:8px">Criar sala</button><div class="subhead">Entrar como jogador</div><div class="form-grid"><div class="field"><label>Código da sala</label><input id="mp-room" maxlength="6" placeholder="A1B2C3"></div><div class="field"><label>Senha de convite</label><input id="mp-pass" type="password" autocomplete="off"></div></div><button id="mp-join" style="width:100%;margin-top:8px">Entrar na sala</button><div class="subhead">Retomar sala como Narrador</div><div class="form-grid"><div class="field"><label>Código</label><input id="mp-host-room" maxlength="6"></div><div class="field"><label>Senha do Narrador</label><input id="mp-host-login-pass" type="password" autocomplete="off"></div></div><button id="mp-host-login" style="width:100%;margin-top:8px">Retomar como Narrador</button><p id="mp-error" style="color:#ff8995;font-size:12px;min-height:16px"></p><p style="color:var(--muted);font-size:11px;margin-bottom:0">Antes de usar, execute o arquivo 01_schema.sql no SQL Editor do Supabase e habilite Email/Password em Authentication. Nunca use a chave service_role neste navegador.</p>`,`<button id="mp-close">Fechar</button>`);const cfg=sbConfig();if(cfg){$('#mp-sb-url').value=cfg.url||'';$('#mp-sb-key').value=cfg.key||''}$('#mp-close')?.addEventListener('click',()=>$('#modal-root').innerHTML='');const err=e=>{$('#mp-error').textContent=e.message||String(e)};$('#mp-sb-save')?.addEventListener('click',()=>{const url=$('#mp-sb-url').value.trim().replace(/\/$/,''),key=$('#mp-sb-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){$('#mp-auth-status').textContent='Informe um Project URL válido e a chave pública.';return}localStorage.setItem('vtm_sb_config',JSON.stringify({url,key}));sb=null;initSupabase();$('#mp-auth-status').textContent='Configuração salva neste navegador.';});const auth=async(signup)=>{try{const client=initSupabase();if(!client)throw new Error('Salve a configuração do Supabase primeiro.');const email=$('#mp-email').value.trim(),password=$('#mp-auth-pass').value;if(!email||password.length<6)throw new Error('Informe e-mail e senha (mínimo de 6 caracteres).');const result=signup?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;$('#mp-auth-status').textContent=signup?'Conta criada. Se a confirmação de e-mail estiver habilitada, confirme-a antes de entrar.':'Sessão autenticada com sucesso.'}catch(e){$('#mp-auth-status').textContent=e.message||String(e)}};$('#mp-signup')?.addEventListener('click',()=>auth(true));$('#mp-login')?.addEventListener('click',()=>auth(false));$('#mp-create')?.addEventListener('click',async()=>{try{const data=await roomRequest('/api/rooms/create',{name:$('#mp-title').value,hostPassword:$('#mp-host-pass').value,joinPassword:$('#mp-join-pass').value,playerName:$('#mp-name').value||'Narrador'});acceptRoom(data);setTimeout(()=>alert(`Sala criada! Código: ${data.room}\nCompartilhe o código e a senha de convite com seus jogadores.`),50)}catch(e){err(e)}});$('#mp-join')?.addEventListener('click',async()=>{try{acceptRoom(await roomRequest('/api/rooms/join',{room:$('#mp-room').value,password:$('#mp-pass').value,playerName:$('#mp-name').value||'Jogador'}))}catch(e){err(e)}});$('#mp-host-login')?.addEventListener('click',async()=>{try{acceptRoom(await roomRequest('/api/rooms/host',{room:$('#mp-host-room').value,password:$('#mp-host-login-pass').value,playerName:$('#mp-name').value||'Narrador'}))}catch(e){err(e)}})}
function showModal(title,body,footer=''){let root=$('#modal-root');root.innerHTML=`<div class="overlay"><div class="modal"><div class="modal-head"><strong>${esc(title)}</strong><button id="modal-close">✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-head" style="justify-content:flex-end">${footer}</div>`:''}</div></div>`;$('#modal-close').onclick=()=>root.innerHTML='';root.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))root.innerHTML=''};$('#room-save')?.addEventListener('click',()=>{let v=$('#room-input').value.trim().replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,48)||'noite-aberta';state.room=v;save(false);history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(v));root.innerHTML='';if(ws&&ws.readyState<2)ws.close();toast('Sala definida: '+v+'. Conectando à nova sala…')});$('#scene-save')?.addEventListener('click',()=>{state.scene=$('#scene-name-input').value.trim()||'Cena sem nome';save();root.innerHTML='';render()});}
function showNewChar(){showModal('Criar personagem',`<div class="form-grid"><div class="field"><label>Nome</label><input id="new-name" value="Novo Vampiro"></div><div class="field"><label>Clã</label><select id="new-clan">${Object.keys(CLANS).map(n=>`<option ${n===state.selectedClan?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Conceito</label><input id="new-concept" value="Predador da noite"></div><div class="field"><label>Jogador</label><input id="new-player"></div><div class="field"><label>Geração</label><input id="new-generation" type="number" min="2" max="13" value="13"></div><div class="field"><label>Potência de Sangue</label><input id="new-pb" type="number" min="1" max="12" value="1"></div></div><p style="color:var(--muted);font-size:11px">A ficha começa com os dois Atributos favorecidos do Clã em 2. Ajuste a distribuição conforme as regras da crônica.</p>`,`<button id="create-char" class="primary">Criar ficha</button>`);$('#create-char').onclick=()=>{let clan=$('#new-clan').value,c=blankChar(clan);c.name=$('#new-name').value.trim()||'Novo Vampiro';c.concept=$('#new-concept').value;c.player=$('#new-player').value;c.generation=+$('#new-generation').value;c.pb=+$('#new-pb').value;c.vitae=derived(c).vitaeMax;c.health=derived(c).health;c.willpower=derived(c).willMax;state.characters.push(c);state.activeCharacterId=c.id;state.selectedClan=clan;state.page='Personagens';save();$('#modal-root').innerHTML='';render()}}
function download(filename,data,type='application/json'){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportChar(){download((char().name||'ficha').replace(/[^a-z0-9_-]/gi,'_')+'.json',JSON.stringify(char(),null,2))}
function exportTable(){download('mesa-vtm5e-'+state.room+'.json',JSON.stringify(state,null,2))}
function importChar(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let c=JSON.parse(r.result);if(!c.name||!c.attributes)throw Error('Ficha inválida');c.id=id();state.characters.push(c);state.activeCharacterId=c.id;save();render();toast('Ficha importada.')}catch(err){toast('Não foi possível importar: '+err.message)}};r.readAsText(f);e.target.value=''}

function ensureMapPages(){
  if(!Array.isArray(state.mapPages)||!state.mapPages.length){state.mapPages=[{id:'map-'+id(),name:'Mapa 1',image:'',tokens:clone(state.tokens||[]),grid:state.mapGrid!==false,zoom:1}];state.activeMapPageId=state.mapPages[0].id;}
  if(!state.activeMapPageId||!state.mapPages.some(m=>m.id===state.activeMapPageId))state.activeMapPageId=state.mapPages[0].id;
  state.mapPages.forEach((m,i)=>{if(!m.id)m.id='map-'+id();if(!m.name)m.name='Mapa '+(i+1);if(!Array.isArray(m.tokens))m.tokens=[];if(typeof m.image!=='string'||(m.image&&!/^data:image\/(?:jpeg|png|webp|gif);base64,/i.test(m.image)))m.image='';if(typeof m.grid!=='boolean')m.grid=true;if(!m.zoom)m.zoom=1;});
  const active=state.mapPages.find(m=>m.id===state.activeMapPageId);if(active){if(!state._mapsLoaded){state.tokens=clone(active.tokens);state.mapGrid=active.grid;state.mapZoom=active.zoom||1;state._mapsLoaded=true;} }
  state.characters.forEach(c=>{if(!Array.isArray(c.attacks))c.attacks=[];if(!Array.isArray(c.savedRolls))c.savedRolls=[];if(c.image===undefined)c.image='';if(c.initiative===undefined)c.initiative=null;if(!c.skillProf)c.skillProf=Object.fromEntries(SKILLS.map(s=>[s,false]));if(!c.skillSpec)c.skillSpec=Object.fromEntries(SKILLS.map(s=>[s,false]));});
  if(state.sheetOpen===undefined)state.sheetOpen=false;
  if(!state.sheetWindow)state.sheetWindow={left:Math.max(210,Math.round(innerWidth*.22)),top:86,width:Math.min(760,Math.round(innerWidth*.68)),height:Math.min(innerHeight*.82,900)};
}
ensureMapPages();
function activeMapPage(){return state.mapPages.find(m=>m.id===state.activeMapPageId)||state.mapPages[0]}
function saveActiveMap(){let m=activeMapPage();if(!m)return;m.tokens=clone(state.tokens||[]);m.grid=state.mapGrid!==false;m.zoom=state.mapZoom||1;const input=$('#grid-cell-size');m.gridSize=Math.max(16,Math.min(160,Number(input?.value||m.gridSize||40)));}
function switchMapPage(idv){saveActiveMap();let m=state.mapPages.find(x=>x.id===idv);if(!m)return;state.activeMapPageId=m.id;state.tokens=clone(m.tokens||[]);state.mapGrid=m.grid!==false;state.mapZoom=m.zoom||1;state.selectedToken=null;save();render()}
function blankChar(clan='Ventrue'){let c={id:id(),name:'',player:'',concept:'',clan,generation:13,pb:1,prof:1,predator:'',sire:'',chronicle:'',nature:'',demeanor:'',attributes:{forca:1,destreza:1,constituicao:1,inteligencia:1,sabedoria:1,carisma:1},skills:Object.fromEntries(SKILLS.map(s=>[s,0])),disciplines:Object.fromEntries(DISCS.map(s=>[s,0])),humanity:5,hunger:0,vitae:15,willpower:6,health:13,skillProf:Object.fromEntries(SKILLS.map(s=>[s,false])),skillSpec:Object.fromEntries(SKILLS.map(s=>[s,false])),healthBonus:0,defenseBonus:0,armor:0,xp:0,convictions:'',touchstones:'',advantages:'',flaws:'',equipment:'',notes:'',specializations:'',conditions:[],initiative:null,image:'',attacks:[],savedRolls:[]};let f=(CLANS[clan]?.fav||'').split(' / ');f.forEach(a=>{if(ATTR_FAV_MAP[a])c.attributes[ATTR_FAV_MAP[a]]=2});c.health=derived(c).health;c.willpower=derived(c).willMax;c.vitae=derived(c).vitaeMax;return c}

function renderSettings(){return `<div class="toolbar"><span class="scene-name">⚙ Configuração da mesa</span></div><div class="settings-grid"><section class="panel"><div class="panel-head"><strong>Sala compartilhada</strong></div><div class="panel-body"><p style="font-size:12px;color:var(--muted)">Compartilhe o endereço do servidor e o mesmo código de sala para sincronizar mapa, tokens, fichas e rolagens.</p><button id="room-btn-settings" class="primary">Configurar sala</button></div></section><section class="panel"><div class="panel-head"><strong>Dados da mesa</strong></div><div class="panel-body"><p style="font-size:12px;color:var(--muted)">Exporte o estado da mesa para cópia de segurança ou restaure uma cópia anterior.</p><div class="mini-actions"><button id="export-btn">Exportar mesa</button><button id="import-table-btn">Importar mesa JSON</button><input id="import-table-file" type="file" accept="application/json" class="hidden"></div></div></section><section class="panel"><div class="panel-head"><strong>Mapas</strong></div><div class="panel-body"><p>Os mapas e imagens ficam salvos no navegador e são incluídos no arquivo JSON exportado da mesa.</p><div class="mini-actions"><button id="export-map-page">Exportar mapa atual</button><button id="import-map-page">Importar mapa JSON</button><input id="import-map-file-settings" type="file" accept="application/json" class="hidden"></div></div></section><section class="panel"><div class="panel-head"><strong>Preferências</strong></div><div class="panel-body"><p style="font-size:12px;color:var(--muted)">Tema gótico escuro com detalhes em vermelho. O zoom pode ser ajustado pela roda do mouse sobre o mapa ou pelos botões + e −.</p><button id="reset-zoom">Redefinir zoom</button></div></section></div>`}

function renderSheet(c,d){

if(step===8){const finalAttrs=WIZ_ATTRS.map(([n,k])=>`${n}: ${(+(base[k]||1))+((CLANS[c.clan]?.fav||'').split(' / ').includes(n)?1:0)}`).join(' · ');body=`<div class="wizard-review"><h3>${wizEsc(c.name||'Personagem sem nome')}</h3><p>${wizEsc(c.concept||'Sem conceito')} · ${wizEsc(c.clan)} · ${wizEsc(c.generation)}ª Geração · PB ${wizEsc(c.pb)}</p><p><b>Atributos:</b> ${wizEsc(finalAttrs)}</p><p><b>Habilidades:</b> ${skillTotal}/18 pontos · <b>Especializações:</b> ${(create.specialties||[]).filter(x=>x.trim()).length}/3</p><p><b>Vantagens:</b> ${create.advantagePoints}/7 · <b>Defeitos:</b> ${create.flawPoints}/5</p><p><b>Convicções:</b> ${convictions} · <b>Tocantes:</b> ${touches}</p><p><b>Disciplinas:</b> ${DISCS.filter(n=>+(c.disciplines?.[n]||0)>0).map(n=>`${n} ${c.disciplines[n]}`).join(', ')||'Nenhuma registrada'}</p><div class="wizard-validation">${wizValidation(c,attrsValid,skillTotal,convictions,touches).map(x=>`<div class="${x.ok?'ok':'warn'}">${x.ok?'✓':'!'} ${wizEsc(x.text)}</div>`).join('')}</div></div>`;}
root.innerHTML=`<div class="wizard-backdrop"><section class="creation-wizard" role="dialog" aria-modal="true" aria-label="Criação Intuitiva"><header class="wizard-head"><div><small>VAMPIRO: A MÁSCARA · 5e d20</small><h2>Criação Intuitiva</h2><p>Etapa ${step+1} de ${WIZ_STEPS.length} — ${WIZ_STEPS[step][0]}</p></div><button id="wiz-close" title="Fechar">✕</button></header><div class="wizard-progress">${WIZ_STEPS.map((x,i)=>`<button data-wiz-goto="${i}" class="${i===step?'active':i<step?'done':''}" title="${wizEsc(x[0])}"><span>${i+1}</span><small>${wizEsc(x[0])}</small></button>`).join('')}</div><div class="wizard-body"><h3>${wizEsc(WIZ_STEPS[step][0])}</h3><p class="wizard-subtitle">${wizEsc(WIZ_STEPS[step][1])}</p>${body}</div><footer class="wizard-footer"><button id="wiz-prev" ${step===0?'disabled':''}>← Anterior</button><span>Rascunho salvo automaticamente neste navegador</span>${step<WIZ_STEPS.length-1?'<button id="wiz-next" class="primary">Próxima etapa →</button>':'<button id="wiz-finish" class="primary">✓ Concluir e salvar ficha</button>'}</footer></section></div>`;

function wizValidation(c,attrsValid,skillTotal,convictions,touches){return [{ok:!!String(c.name||'').trim(),text:'Nome do personagem preenchido'},{ok:!!String(c.concept||'').trim(),text:'Conceito preenchido'},{ok:attrsValid,text:'Atributos seguem 3, 2, 2, 1, 1, 1 antes do bônus de Clã'},{ok:skillTotal===18,text:`Distribuição de Habilidades: ${skillTotal}/18 pontos`},{ok:(c.creation?.specialties||[]).filter(x=>x.trim()).length===3,text:'Três especializações preenchidas'},{ok:+c.creation?.advantagePoints===7,text:`Pontos de Vantagem: ${c.creation?.advantagePoints??0}/7`},{ok:+c.creation?.flawPoints<=5&&+c.creation?.flawPoints>=0,text:`Pontos de Defeito: ${c.creation?.flawPoints??0}/5`},{ok:convictions>=2&&convictions<=4,text:`Convicções: ${convictions} (esperado 2–4)`},{ok:touches>=1&&touches<=3,text:`Tocantes: ${touches} (esperado 1–3)`},{ok:!!c.clan,text:'Clã selecionado'},{ok:+c.generation>=2&&+c.generation<=13,text:'Geração entre 2ª e 13ª'},{ok:+c.pb>=1&&+c.pb<=12,text:'Potência de Sangue entre 1 e 12'}]}
function wizOpen(resume=false){if(!resume||!state.wizardDraft){state.wizardDraft=clone(wizNewDraft());state.wizardStep=0;}const root=document.getElementById('wizard-root')||document.createElement('div');root.id='wizard-root';if(!root.parentNode)document.body.appendChild(root);save(false);wizRender()}
function wizClose(){if(!confirm('Fechar a Criação Intuitiva? O rascunho será mantido para continuar depois.'))return;state.wizardDraft=state.wizardDraft||null;save(false);document.getElementById('wizard-root')?.replaceChildren()}
function wizUpdateField(el){const c=state.wizardDraft;if(!c)return;const key=el.dataset.wizField;let value=el.type==='number'?Number(el.value):el.value;if(key.startsWith('creation.')){const k=key.split('.')[1];c.creation[k]=value;}else if(['generation','pb','prof','humanity','hunger','xp'].includes(key)){c[key]=value;}else c[key]=value;if(key==='clan'){const favored=(CLANS[value]?.fav||'').split(' / ');c.creation.baseAttributes=c.creation.baseAttributes||{};WIZ_ATTRS.forEach(([label,k])=>{if(c.creation.baseAttributes[k]==null)c.creation.baseAttributes[k]=1});}if(key==='predator'){c.predator=value;}save(false)}
function wizAdvance(){const c=state.wizardDraft;if(!c)return;const step=+state.wizardStep||0;if(step===2){const base=c.creation.baseAttributes||{};if(Object.values(base).map(Number).sort((a,b)=>b-a).join(',')!=='3,2,2,1,1,1'){toast('Distribua os Atributos como 3, 2, 2, 1, 1, 1 antes de continuar.');return}}if(step===3){const n=SKILLS.reduce((a,k)=>a+(+c.skills[k]||0),0);if(n!==18){toast(`Distribua exatamente 18 pontos de Habilidade (atual: ${n}).`);return}if((c.creation.specialties||[]).filter(x=>x.trim()).length!==3){toast('Preencha as três especializações.');return}}if(step===5){if(+c.creation.advantagePoints!==7||+c.creation.flawPoints>5||+c.creation.flawPoints<0){toast('Use 7 pontos de Vantagem e no máximo 5 pontos de Defeito.');return}}if(step===6){const cv=String(c.convictions||'').split(/\n/).filter(x=>x.trim()).length,ts=String(c.touchstones||'').split(/\n/).filter(x=>x.trim()).length;if(cv<2||cv>4||ts<1||ts>3){toast('Informe de 2 a 4 Convicções e de 1 a 3 Tocantes, uma por linha.');return}}state.wizardStep=Math.min(WIZ_STEPS.length-1,step+1);save(false);wizRender()}
function wizFinish(){const c=state.wizardDraft;if(!c)return;const base=c.creation.baseAttributes||{};if(!String(c.name||'').trim()||!String(c.concept||'').trim()){toast('Preencha nome e conceito.');return}if(Object.values(base).map(Number).sort((a,b)=>b-a).join(',')!=='3,2,2,1,1,1'){toast('Distribuição de Atributos inválida.');return}if(SKILLS.reduce((a,k)=>a+(+c.skills[k]||0),0)!==18){toast('A distribuição de Habilidades precisa somar 18 pontos.');return}if((c.creation.specialties||[]).filter(x=>x.trim()).length!==3){toast('Preencha três especializações.');return}const cv=String(c.convictions||'').split(/\n/).filter(x=>x.trim()).length,ts=String(c.touchstones||'').split(/\n/).filter(x=>x.trim()).length;if(cv<2||cv>4||ts<1||ts>3){toast('A ficha exige 2–4 Convicções e 1–3 Tocantes.');return}if(+c.creation.advantagePoints!==7||+c.creation.flawPoints>5){toast('Confira os pontos de Vantagem e Defeito.');return}const fav=(CLANS[c.clan]?.fav||'').split(' / ');c.attributes={};WIZ_ATTRS.forEach(([label,k])=>c.attributes[k]=(+base[k]||1)+(fav.includes(label)?1:0));c.specializations=(c.creation.specialties||[]).filter(x=>x.trim()).join('\n');c.resources=c.resources||{};c.resources.backgrounds=c.creation.backgrounds||'';c.resources.specialAdvantages=c.creation.specialAdvantages||'';c.resources.specialFlaws=c.creation.specialFlaws||'';c.resources.clanTraits=c.creation.clanTraits||'';c.disciplineNotes=c.creation.disciplineNotes||'';c.prof=1;c.hunger=Number(c.hunger??1);c.generation=Number(c.generation||13);c.pb=Number(c.pb||1);const pbMax={13:1,12:2,11:3,10:4,9:5,8:6,7:7,6:8,5:9,4:10,3:11,2:12}[c.generation]||1;if(c.pb>pbMax){if(!confirm(`PB ${c.pb} excede o limite natural ${pbMax} da ${c.generation}ª Geração. Confirmar exceção aprovada pelo Narrador?`))return}c.health=derived(c).health;c.willpower=derived(c).willMax;c.vitae=derived(c).vitaeMax;c.creationCompleted=true;delete c.creation;state.characters.push(c);state.activeCharacterId=c.id;state.selectedClan=c.clan;state.page='Personagens';state.sheetTab='Atributos';state.sheetOpen=true;state.sheetMinimized=false;state.wizardDraft=null;state.wizardStep=0;save();document.getElementById('wizard-root')?.replaceChildren();render();toast('Personagem criado e salvo com todas as escolhas.');}
function wizEvent(e){const t=e.target;if(!state.wizardDraft)return;if(t.matches('[data-wiz-field]')){wizUpdateField(t);return}if(t.matches('[data-wiz-attr]')){state.wizardDraft.creation.baseAttributes[t.dataset.wizAttr]=Number(t.value);save(false);wizRender();return}if(t.matches('[data-wiz-skill]')){state.wizardDraft.skills[t.dataset.wizSkill]=Number(t.value);save(false);wizRender();return}if(t.matches('[data-wiz-disc]')){state.wizardDraft.disciplines[t.dataset.wizDisc]=Number(t.value);save(false);wizRender();return}if(t.matches('[data-wiz-specialty]')){state.wizardDraft.creation.specialties[+t.dataset.wizSpecialty]=t.value;save(false);return}}
document.addEventListener('change',wizEvent);document.addEventListener('input',e=>{if(e.target.matches('[data-wiz-field], [data-wiz-specialty]')){wizEvent(e)}});document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='wiz-close'){wizClose();return}if(t.id==='wiz-prev'){state.wizardStep=Math.max(0,(+state.wizardStep||0)-1);wizRender();return}if(t.id==='wiz-next'){wizAdvance();return}if(t.id==='wiz-finish'){wizFinish();return}if(t.matches('[data-wiz-goto]')){const target=+t.dataset.wizGoto;if(target<state.wizardStep||target===state.wizardStep+1){state.wizardStep=target;wizRender()}return}if(t.id==='new-intuitive-char'){wizOpen(false);return}if(t.id==='resume-intuitive-char'){wizOpen(true);return}});

der:1px solid #30313b;border-radius:10px;padding:12px;background:#101219}.wizard-attribute label{font-size:12px;color:#e1dce0}.wizard-attribute small{display:block;min-height:13px;color:#d4a65c;font-size:10px;margin-top:5px}.wizard-skill-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.wizard-skill{display:grid;grid-template-columns:1fr 58px;align-items:center;gap:8px;padding:6px 8px;border:1px solid #282b34;border-radius:7px;background:#101219;text-transform:none;letter-spacing:0;margin:0}.wizard-skill span{font-size:11px;color:#dedde3}.wizard-skill select{padding:5px}.wizard-footer{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid #30252d;background:#0c0e14}.wizard-footer span{margin:auto;color:#8d909c;font-size:10px}.wizard-review{border:1px solid #37303a;background:#101219;border-radius:12px;padding:16px}.wizard-review h3{margin:0}.wizard-review p{font-size:12px;color:#c6c5ce;line-height:1.6}.wizard-validation{display:grid;gap:6px;margin-top:16px}.wizard-validation div{font-size:12px;padding:7px 9px;border-radius:6px;background:#251b1f}.wizard-validation .ok{color:#85d4a8;background:#13251d}.wizard-validation .warn{color:#ffd080;background:#2a2115}@media(max-width:700px){.wizard-backdrop{padding:4px}.creation-wizard{height:98vh;width:100vw;border-radius:10px}.wizard-body{padding:14px}.wizard-attribute-grid,.wizard-skill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wizard-footer span{display:none}.wizard-progress button{min-width:58px}.wizard-progress button small{font-size:8px}}`;
